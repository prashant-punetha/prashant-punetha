<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="100%" height="370">
  <defs>
    <style>
      .terminal {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 1.5;
        rx: 10;
      }
      .titlebar {
        fill: #161b22;
        stroke: #30363d;
        stroke-width: 1.5;
        rx: 10;
      }
      .font-code {
        font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', Menlo, Monaco, Consolas, monospace;
        font-size: 13.5px;
      }
      .cursor {
        fill: #58a6ff;
        animation: blink 0.8s infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      
      /* Command line typing animation */
      @keyframes typeCmd {
        0%, 2% { clip-path: inset(0 100% 0 0); }
        10%, 92% { clip-path: inset(0 0% 0 0); }
        98%, 100% { clip-path: inset(0 100% 0 0); }
      }
      .cmd-text {
        animation: typeCmd 14s infinite cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      /* Block 1: AI & ML */
      @keyframes appearB1 {
        0%, 12% { opacity: 0; transform: translateY(4px); }
        17%, 92% { opacity: 1; transform: translateY(0); }
        97%, 100% { opacity: 0; }
      }
      .block-1 {
        animation: appearB1 14s infinite ease-out;
      }
      
      /* Block 2: DSA */
      @keyframes appearB2 {
        0%, 27% { opacity: 0; transform: translateY(4px); }
        32%, 92% { opacity: 1; transform: translateY(0); }
        97%, 100% { opacity: 0; }
      }
      .block-2 {
        animation: appearB2 14s infinite ease-out;
      }
      
      /* Block 3: Data Science */
      @keyframes appearB3 {
        0%, 42% { opacity: 0; transform: translateY(4px); }
        47%, 92% { opacity: 1; transform: translateY(0); }
        97%, 100% { opacity: 0; }
      }
      .block-3 {
        animation: appearB3 14s infinite ease-out;
      }
      
      /* Block 4: Software Eng */
      @keyframes appearB4 {
        0%, 57% { opacity: 0; transform: translateY(4px); }
        62%, 92% { opacity: 1; transform: translateY(0); }
        97%, 100% { opacity: 0; }
      }
      .block-4 {
        animation: appearB4 14s infinite ease-out;
      }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="1" y="1" width="758" height="368" class="terminal" />
  <rect x="1" y="1" width="758" height="36" class="titlebar" />
  
  <!-- Window Controls (macOS style) -->
  <circle cx="20" cy="19" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="40" cy="19" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="60" cy="19" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />
  
  <!-- Terminal Title -->
  <text x="380" y="23" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500">prashant@punetha: ~ (currently-learning)</text>

  <!-- Terminal Content Body -->
  <g class="font-code">
    <!-- Command Prompt Line -->
    <g class="cmd-text">
      <text x="24" y="68" fill="#58a6ff" font-weight="bold">$</text>
      <text x="40" y="68" fill="#7ee787">prashant</text>
      <text x="116" y="68" fill="#ffa657">--status</text>
      <text x="190" y="68" fill="#79c0ff">&quot;currently-learning&quot;</text>
    </g>

    <!-- Pillar 1: AI & ML -->
    <g class="block-1">
      <text x="24" y="102" fill="#38bdf8" font-weight="bold">[+] Artificial Intelligence &amp; Machine Learning</text>
      <text x="54" y="124" fill="#58a6ff">├──</text>
      <text x="84" y="124" fill="#c9d1d9">Supervised &amp; Unsupervised ML Algorithms &amp; Optimization</text>
      <text x="54" y="146" fill="#58a6ff">└──</text>
      <text x="84" y="146" fill="#c9d1d9">Deep Learning Foundations &amp; HuggingFace Models</text>
    </g>

    <!-- Pillar 2: DSA -->
    <g class="block-2">
      <text x="24" y="180" fill="#fb923c" font-weight="bold">[+] Data Structures &amp; Algorithms</text>
      <text x="54" y="202" fill="#58a6ff">├──</text>
      <text x="84" y="202" fill="#c9d1d9">Algorithmic Problem Solving in <tspan fill="#60a5fa">C++</tspan> &amp; <tspan fill="#fbbf24">Python</tspan> (Trees, Graphs, DP)</text>
      <text x="54" y="224" fill="#58a6ff">└──</text>
      <text x="84" y="224" fill="#c9d1d9">Complexity Optimization &amp; Daily Practice on <tspan fill="#f59e0b">LeetCode</tspan></text>
    </g>

    <!-- Pillar 3: Data Science -->
    <g class="block-3">
      <text x="24" y="258" fill="#34d399" font-weight="bold">[+] Data Science &amp; Analytics</text>
      <text x="54" y="280" fill="#58a6ff">├──</text>
      <text x="84" y="280" fill="#c9d1d9">High-Performance Processing with <tspan fill="#38bdf8">NumPy</tspan> &amp; <tspan fill="#818cf8">Pandas</tspan></text>
      <text x="54" y="302" fill="#58a6ff">└──</text>
      <text x="84" y="302" fill="#c9d1d9">Exploratory Data Analysis (EDA) &amp; Visualization with <tspan fill="#38bdf8">Matplotlib</tspan></text>
    </g>

    <!-- Pillar 4: Software Engineering & Systems -->
    <g class="block-4">
      <text x="24" y="336" fill="#a78bfa" font-weight="bold">[+] Software Engineering &amp; Systems</text>
      <text x="54" y="358" fill="#58a6ff">└──</text>
      <text x="84" y="358" fill="#c9d1d9">Source-to-Source Transpilation (AST Parsing) &amp; OOP Architecture</text>
      <rect x="645" y="346" width="9" height="15" class="cursor" />
    </g>
  </g>
</svg>